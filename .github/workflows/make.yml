name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOBS: 4
      SCCACHE_GHA_ENABLED: "on"
      TMPDIR: /tmp

    steps:
      - uses: actions/checkout@v4
      - name: Compute submodule hash
        id: submodules
        run: echo "hash=$(git ls-tree -r HEAD | grep '^160000' | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: |
            .git/modules
            vendor
          key: submodules-${{ steps.submodules.outputs.hash }}
          restore-keys: |
            submodules-
      - name: Update submodules
        run: git submodule update --init --recursive
      - uses: cachix/install-nix-action@v18
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - uses: actions/cache@v5
        with:
          path: |
            build
            build-test
          key: cmake-${{ runner.os }}-${{ steps.submodules.outputs.hash }}-${{ hashFiles('CMakePresets.json', 'cmake/**', 'nix/sources.json', 'CMakeLists.txt', 'src/**', 'lib/**', 'tests/**') }}
          restore-keys: |
            cmake-${{ runner.os }}-
      - name: Configure sccache GHA backend
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: install nix dependencies
        run: nix-shell --run true
      - name: Start sccache server
        run: nix-shell --run "TMPDIR=/tmp sccache --start-server"
      - name: check formatting
        run: nix-shell --run "make fmt-check"
      - name: build ARM firmware
        run: nix-shell --run make
      - name: run tests
        run: nix-shell --run "make test"
      # TODO(aspen): Fix this and get it running
      # - name: lint
      #   run: nix-shell --run "make lint"
